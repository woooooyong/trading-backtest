spring.application.name=trading-backtest

spring.datasource.url=jdbc:mysql://mysql:3306/trading_backtest?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-milliseconds=3600000

alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY}