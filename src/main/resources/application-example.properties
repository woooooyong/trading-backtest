spring.application.name=trading-backtest

spring.datasource.url=jdbc:mysql://localhost:3306/trading_backtest?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS
jwt.expiration-milliseconds=3600000

alpha-vantage.api-key=YOUR_ALPHA_VANTAGE_API_KEY